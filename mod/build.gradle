plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = 'dev.mario64mc'
base { archivesName = 'mario64mc' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

loom {
    runs {
        autotest {
            inherit client
            name 'Mario Autotest'
            vmArg '-Dmario64.autotest=moves'
            programArgs '--width', '1280', '--height', '720'
        }
    }
}

loom {
    runs {
        course {
            inherit client
            name 'Mario Course'
            vmArg '-Dmario64.autotest=course'
            vmArg '-Dmario64.world=MarioFlat'
            vmArg '-Dmario64.preset=flat'
            vmArg '-Dmario64.setup=tp @s 0.5 -60 0.5 0 0;fill -1 -60 4 1 -60 8 stone;fill -1 -59 5 1 -59 8 stone;fill -1 -58 6 1 -58 8 stone;setblock 0 -60 3 oak_stairs[facing=south];setblock 0 -59 4 oak_stairs[facing=south];setblock 0 -58 5 oak_stairs[facing=south];kill @e[type=pig];summon pig 0 -60 12 {NoAI:1b};fill -3 -63 15 3 -61 22 water'
            programArgs '--width', '1280', '--height', '720'
        }
    }
}

loom {
    runs {
        show {
            inherit client
            name 'Mario Showcase'
            vmArg '-Dmario64.autotest=show'
            vmArg '-Dmario64.world=MarioShow'
            vmArg '-Dmario64.preset=flat'
            vmArg '-Dmario64.setup=tp @s 0.5 -60 0.5 0 0;fill -1 -60 25 1 -60 29 stone;fill -1 -59 26 1 -59 29 stone;fill -1 -58 27 1 -58 29 stone;setblock 0 -60 24 oak_stairs[facing=south];setblock 0 -59 25 oak_stairs[facing=south];setblock 0 -58 26 oak_stairs[facing=south];summon pig 0 -60 33 {NoAI:1b};fill -3 -63 37 3 -61 46 water;summon pig 2 -60 10 {NoAI:1b}'
            programArgs '--width', '1280', '--height', '720'
        }
    }
}

loom {
    runs {
        tech {
            inherit client
            name 'Mario Tech (long jump + wall kick)'
            vmArg '-Dmario64.autotest=tech'
            vmArg '-Dmario64.world=MarioTech'
            vmArg '-Dmario64.preset=flat'
            vmArg '-Dmario64.setup=tp @s 0.5 -60 0.5 0 0;fill -4 -60 30 4 -51 30 stone'
            programArgs '--width', '1280', '--height', '720'
        }
    }
}

loom {
    runs {
        flips {
            inherit client
            name 'Mario Flips (backflip, side flip, slide kick)'
            vmArg '-Dmario64.autotest=flips'
            vmArg '-Dmario64.world=MarioFlips'
            vmArg '-Dmario64.preset=flat'
            vmArg '-Dmario64.setup=tp @s 0.5 -60 0.5 0 0'
            programArgs '--width', '1280', '--height', '720'
        }
    }
}

loom {
    runs {
        controls {
            inherit client
            name 'Mario Controls UI'
            vmArg '-Dmario64.autotest=controls'
            vmArg '-Dmario64.world=MarioFlips'
            vmArg '-Dmario64.preset=flat'
            programArgs '--width', '1280', '--height', '720'
        }
    }
}

loom {
    runs {
        gamepad {
            inherit client
            name 'Mario Gamepad'
            vmArg '-Dmario64.autotest=gamepad'
            vmArg '-Dmario64.world=MarioFlips'
            vmArg '-Dmario64.preset=flat'
            programArgs '--width', '1280', '--height', '720'
        }
    }
}
